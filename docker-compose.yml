services:
    walletservice:
      build:
        context: ./CrashLab.Game/CrashLab.WalletService
      environment:
        ConnectionStrings__Default: "Host=pgbouncer;Port=6432;Database=crashlab;Username=crashlab;Password=crashlab;Pooling=false"
      ports:
        - "8081:8080"
      depends_on:
        - pgbouncer

    gateway:
      build:
        context: ./CrashLab.Game/CrashLab.GateWay
      environment:
        ReverseProxy__Clusters__realtime-cluster__Destinations__destination1__Address: "http://realtimegateway:8080"
        ReverseProxy__Clusters__realtime-cluster__Destinations__destination2__Address: "http://realtimegateway:8080"
        ReverseProxy__Clusters__gameengine-cluster__Destinations__destination1__Address: "http://gameengine:8080"
        ReverseProxy__Clusters__wallet-cluster__Destinations__destination1__Address: "http://walletservice:8080"
      ports:
        - "8080:8080"
      depends_on:
        - gameengine
        - walletservice
        - realtimegateway

    gameengine:
      build:
        context: ./CrashLab.Game/CrashLab.GameEngine
      environment:
        WalletConfiguration__BaseUrl: "http://walletservice:8080"
        ConnectionStrings__Default: "Host=gameengine-postgres;Port=5432;Database=gameengine;Username=gameengine;Password=gameengine;Maximum Pool Size=200"
        Redis__ConnectionString: "redis:6379"
        Kafka__BootstrapServers: "kafka:9092"
      ports:
        - "8082:8080"
      depends_on:
        - gameengine-postgres
        - walletservice

    realtimegateway:
      build:
        context: ./CrashLab.Game/CrashLab.RealTimeGateWay
      environment:
        Redis__ConnectionString: "redis:6379"
        Kafka__BootstrapServers: "kafka:9092"
      ports:
        - "8083:8080"
      depends_on:
        - redis
        - kafka

    settlementservice:
      build:
        context: ./CrashLab.Game/CrashLab.SettlementService
      environment:
        ConnectionStrings__Default: "Host=settlement-postgres;Port=5432;Database=settlement;Username=settlement;Password=settlement"
        Kafka__BootstrapServers: "kafka:9092"
      ports:
        - "8084:8080"
      depends_on:
        - settlement-postgres
        - kafka

    identityserver:
      build:
        context: ./CrashLab.Game/CrashLab.IdentityServer
      environment:
        ConnectionStrings__Default: "Host=identity-postgres;Port=5432;Database=identity;Username=identity;Password=identity"
      ports:
        - "8085:8080"
      depends_on:
        - identity-postgres

    frontend:
      build:
        context: ./frontend
        args:
          VITE_GATEWAY_URL: "http://localhost:8080"
          VITE_IDENTITY_URL: "http://host.docker.internal:8085"
          VITE_APP_URL: "http://localhost:5173"
      ports:
        - "5173:80"
      depends_on:
        - gateway
        - identityserver
    
    prometheus:
      image: prom/prometheus:latest
      ports:
        - "9090:9090"
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    grafana:
      image: grafana/grafana:latest
      ports:
        - "3000:3000"
      volumes:
        - ./grafana/provisioning:/etc/grafana/provisioning
        - grafana-data:/var/lib/grafana
      depends_on:
        - prometheus
    
    redis:
      image: redis:latest
      ports:
        - "6379:6379"
    
    postgres:
      image: postgres:16
      command: ["postgres", "-c", "max_connections=600"]
      environment:
        POSTGRES_USER: crashlab
        POSTGRES_PASSWORD: crashlab
        POSTGRES_DB: crashlab
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data

    pgbouncer:
      image: pgbouncer/pgbouncer:latest
      environment:
        DATABASES_HOST: postgres
        DATABASES_PORT: "5432"
        DATABASES_USER: crashlab
        DATABASES_PASSWORD: crashlab
        DATABASES_DBNAME: crashlab
        PGBOUNCER_POOL_MODE: transaction
        PGBOUNCER_MAX_CLIENT_CONN: "2500"
        PGBOUNCER_DEFAULT_POOL_SIZE: "300"
        PGBOUNCER_AUTH_TYPE: any
      ports:
        - "6432:6432"

    gameengine-postgres:
      image: postgres:16
      command: ["postgres", "-c", "max_connections=300"]
      environment:
        POSTGRES_USER: gameengine
        POSTGRES_PASSWORD: gameengine
        POSTGRES_DB: gameengine
      ports:
        - "5433:5432"
      volumes:
        - gameengine-postgres-data:/var/lib/postgresql/data

    settlement-postgres:
      image: postgres:16
      environment:
        POSTGRES_USER: settlement
        POSTGRES_PASSWORD: settlement
        POSTGRES_DB: settlement
      ports:
        - "5434:5432"
      volumes:
        - settlement-postgres-data:/var/lib/postgresql/data

    identity-postgres:
      image: postgres:16
      environment:
        POSTGRES_USER: identity
        POSTGRES_PASSWORD: identity
        POSTGRES_DB: identity
      ports:
        - "5435:5432"
      volumes:
        - identity-postgres-data:/var/lib/postgresql/data

    kafka:
      image: apache/kafka:latest
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        KAFKA_LOG_DIRS: /var/lib/kafka/data
      volumes:
        - kafka-data:/var/lib/kafka/data

volumes:
  postgres-data:
  kafka-data:
  gameengine-postgres-data:
  settlement-postgres-data:
  grafana-data:
  identity-postgres-data:
