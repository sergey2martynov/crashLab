services:
    prometheus:
      image: prom/prometheus:latest
      ports:
        - "9090:9090"
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    grafana:
      image: grafana/grafana:latest
      ports:
        - "3000:3000"
      volumes:
        - ./grafana/provisioning:/etc/grafana/provisioning
        - grafana-data:/var/lib/grafana
      depends_on:
        - prometheus
    
    redis:
      image: redis:latest
      ports:
        - "6379:6379"
    
    postgres:
      image: postgres:16
      command: ["postgres", "-c", "max_connections=600"]
      environment:
        POSTGRES_USER: crashlab
        POSTGRES_PASSWORD: crashlab
        POSTGRES_DB: crashlab
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data

    pgbouncer:
      image: pgbouncer/pgbouncer:latest
      environment:
        DATABASES_HOST: postgres
        DATABASES_PORT: "5432"
        DATABASES_USER: crashlab
        DATABASES_PASSWORD: crashlab
        DATABASES_DBNAME: crashlab
        PGBOUNCER_POOL_MODE: transaction
        PGBOUNCER_MAX_CLIENT_CONN: "2500"
        PGBOUNCER_DEFAULT_POOL_SIZE: "300"
        PGBOUNCER_AUTH_TYPE: any
      ports:
        - "6432:6432"

    gameengine-postgres:
      image: postgres:16
      command: ["postgres", "-c", "max_connections=300"]
      environment:
        POSTGRES_USER: gameengine
        POSTGRES_PASSWORD: gameengine
        POSTGRES_DB: gameengine
      ports:
        - "5433:5432"
      volumes:
        - gameengine-postgres-data:/var/lib/postgresql/data

    settlement-postgres:
      image: postgres:16
      environment:
        POSTGRES_USER: settlement
        POSTGRES_PASSWORD: settlement
        POSTGRES_DB: settlement
      ports:
        - "5434:5432"
      volumes:
        - settlement-postgres-data:/var/lib/postgresql/data

    identity-postgres:
      image: postgres:16
      environment:
        POSTGRES_USER: identity
        POSTGRES_PASSWORD: identity
        POSTGRES_DB: identity
      ports:
        - "5435:5432"
      volumes:
        - identity-postgres-data:/var/lib/postgresql/data

    kafka:
      image: apache/kafka:latest
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        KAFKA_LOG_DIRS: /var/lib/kafka/data
      volumes:
        - kafka-data:/var/lib/kafka/data

volumes:
  postgres-data:
  kafka-data:
  gameengine-postgres-data:
  settlement-postgres-data:
  grafana-data:
  identity-postgres-data:
