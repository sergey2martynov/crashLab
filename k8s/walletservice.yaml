apiVersion: apps/v1
kind: Deployment
metadata:
  name: walletservice
  namespace: crashlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: walletservice
  template:
    metadata:
      labels:
        app: walletservice
    spec:
      containers:
        - name: walletservice
          image: walletservice:local
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__Default
              value: "Host=pgbouncer;Port=6432;Database=crashlab;Username=crashlab;Password=crashlab;Pooling=false"
            - name: DevelopmentSecretCert
              valueFrom:
                secretKeyRef:
                  name: openiddict-secret
                  key: key
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: walletservice
  namespace: crashlab
spec:
  selector:
    app: walletservice
  ports:
    - port: 8080
      targetPort: 8080