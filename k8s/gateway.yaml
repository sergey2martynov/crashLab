apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: crashlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:local
          imagePullPolicy: Never
          env:
            - name: ReverseProxy__Clusters__realtime-cluster__Destinations__destination1__Address
              value: "http://realtimegateway:8080"
            - name: ReverseProxy__Clusters__realtime-cluster__Destinations__destination2__Address
              value: "http://realtimegateway:8080"
            - name: ReverseProxy__Clusters__gameengine-cluster__Destinations__destination1__Address
              value: "http://gameengine:8080"
            - name: ReverseProxy__Clusters__wallet-cluster__Destinations__destination1__Address
              value: "http://walletservice:8080"
            - name: DevelopmentSecretCert
              valueFrom:
                secretKeyRef:
                  name: openiddict-secret
                  key: key
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: crashlab
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
