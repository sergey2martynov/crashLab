apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtimegateway
  namespace: crashlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtimegateway
  template:
    metadata:
      labels:
        app: realtimegateway
    spec:
      containers:
        - name: realtimegateway
          image: realtimegateway:local
          imagePullPolicy: Never
          env:
            - name: Redis__ConnectionString
              value: "redis:6379"
            - name: Kafka__BootstrapServers
              value: "kafka:9092"
            - name: DevelopmentSecretCert
              valueFrom:
                secretKeyRef:
                  name: openiddict-secret
                  key: key
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: realtimegateway
  namespace: crashlab
spec:
  selector:
    app: realtimegateway
  ports:
    - port: 8080
      targetPort: 8080