apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlementservice
  namespace: crashlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlementservice
  template:
    metadata:
      labels:
        app: settlementservice
    spec:
      containers:
        - name: settlementservice
          image: settlementservice:local
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__Default
              value: "Host=settlement-postgres;Port=5432;Database=settlement;Username=settlement;Password=settlement"
            - name: Kafka__BootstrapServers
              value: "kafka:9092"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: settlementservice
  namespace: crashlab
spec:
  selector:
    app: settlementservice
  ports:
    - port: 8080
      targetPort: 8080