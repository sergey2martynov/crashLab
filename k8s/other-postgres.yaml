apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gameengine-postgres-data
  namespace: crashlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameengine-postgres
  namespace: crashlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameengine-postgres
  template:
    metadata:
      labels:
        app: gameengine-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args: ["postgres", "-c", "max_connections=300"]
          env:
            - name: POSTGRES_USER
              value: gameengine
            - name: POSTGRES_DB
              value: gameengine
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: gameengine-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gameengine-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: gameengine-postgres
  namespace: crashlab
spec:
  selector:
    app: gameengine-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
